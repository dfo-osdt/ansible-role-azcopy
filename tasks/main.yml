---
- name: Stop role if not running on Ubuntu
  ansible.builtin.fail:
    msg: "This role only works on Ubuntu"
  when: ansible_distribution != 'Ubuntu'

- name: Create /etc/apt/keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download and install Microsoft GPG key
  become: true
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > packages.microsoft.gpg
      install -D -o root -g root -m 644 packages.microsoft.gpg /etc/apt/keyrings/packages.microsoft.gpg
      rm -f packages.microsoft.gpg
    creates: /etc/apt/keyrings/packages.microsoft.gpg
    executable: /bin/bash

- name: Add Microsoft repository with signed-by
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/ubuntu/{{ansible_distribution_version}}/prod {{ ansible_distribution_release }} main"
    state: present

- name: update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install AzCopy
  become: true
  ansible.builtin.apt:
    name: azcopy
    state: present
